/* ---------- sprite builder: shapes on a pixel grid, then automatic outline and shading ---------- */
function Sprite(w, h) { this.w = w; this.h = h; this.c = new Array(w * h).fill(null); }

function park(t) {
  // ground
  for (let y = 0; y < 14; y++) for (let x = 0; x < 16; x++) {
    const onPath = (y >= 7 && y <= 8) || (x >= 7 && x <= 8 && y >= 2);
    (onPath ? cobble : grass)(x * T, y * T, x * 31 + y * 17 + 1);
  }
  for (let x = 0; x < 16; x++) if (x < 6 || x > 9) { hedge(x * T, 10 * T, x * 13 + 5); }
  for (let y = 11; y < 14; y++) for (let x = 0; x < 16; x++) if ((x + y) % 5 === 0 && !(x >= 7 && x <= 8)) flowers(x * T, y * T, x * 3 + y * 11);
  for (let x = 1; x < 6; x++) if (x !== 3) flowers(x * T, 5 * T, x * 9 + 2);
  tree(-20, -36); tree(380, -40); tree(430, 150); tree(-30, 230);
  fountain(2 * T + 10, 2 * T - 4, t);
  stall(11 * T, 3 * T - 6);
  [[2, 9], [12, 9], [5, 6]].forEach(p => pot(p[0] * T, p[1] * T));
  sign(9 * T + 4, 9 * T + 6);
  goon(12 * T + 4, 6 * T - 4, true); goon(10 * T + 14, 8 * T + 14, true);
  hero(7 * T - 1, 7 * T - 12);

  g.globalCompositeOperation = 'multiply'; g.fillStyle = '#7d6fb0'; g.fillRect(0, 0, W, H);
