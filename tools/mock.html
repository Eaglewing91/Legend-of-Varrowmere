<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block;image-rendering:pixelated}</style></head><body>
<canvas id="c" width="1024" height="896"></canvas>
<script>
const W = 512, H = 448, T = 32, MODE = location.hash.slice(1) || 'park';
const cv = document.getElementById('c'), out = cv.getContext('2d'); out.imageSmoothingEnabled = false;
const g0 = document.createElement('canvas'); g0.width = W; g0.height = H; const g = g0.getContext('2d');
let seed = 7; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const px = (x, y, c, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(x | 0, y | 0, w, h); };
// pixel sprite from strings + palette
function spr(rows, pal, x, y, flip) { rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const k = r[i]; if (k !== '.' && pal[k]) px(flip ? x + r.length - 1 - i : x + i, y + j, pal[k]); } }); }

/* ---------- tiles ---------- */
function grass(x, y, s) { seed = s; px(x, y, '#4a8a34', T, T); for (let i = 0; i < 70; i++) { const a = R() * T, b = R() * T; px(x + a, y + b, R() < .5 ? '#5aa03e' : '#3d7a2b', 1, 2); } for (let i = 0; i < 6; i++) { const a = R() * 28, b = R() * 28; px(x + a, y + b, '#6dba48', 1, 1); px(x + a + 1, y + b + 1, '#6dba48'); } }
function cobble(x, y, s) { seed = s; px(x, y, '#5e5a66', T, T); for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) { const ox = x + i * 8 + (j % 2 ? 4 : 0) - 2, oy = y + j * 8; const c = ['#8f8a98', '#827d8c', '#9a95a3', '#78737f'][(R() * 4) | 0]; px(ox + 1, oy + 1, c, 6, 6); px(ox + 1, oy + 1, '#aaa5b3', 5, 1); px(ox + 1, oy + 6, '#5a5562', 6, 1); } }

function tree(x, y) { // 3x3 tiles: canopy + trunk
  px(x + 38, y + 62, '#5b3a22', 20, 30); px(x + 40, y + 62, '#704a2c', 4, 30); px(x + 30, y + 88, 'rgba(0,0,0,.35)', 36, 6);
  const blob = (cx, cy, r, c) => { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (i * i + j * j <= r * r) px(cx + i, cy + j, c); };

  for (let j = -36; j <= 36; j++) for (let i = -44; i <= 44; i++) if ((i * i) / 1936 + (j * j) / 1296 <= 1) { const w = Math.sin((i + t * 30) * .3 + j * .2) > .7; px(x + 48 + i, y + 50 + j * .75 + 0, w ? '#9fe6ff' : ((i + j) & 4 ? '#3fa8e0' : '#3496d0')); }
  ring(45, '#a7a1b0'); ring(43, '#7d7889'); ring(47, '#5d5868');

  px(x + 46, y + 8, '#e8fbff', 4, 18);

function lamp(x, y) { px(x + 14, y - 30, '#22202a', 4, 54); px(x + 10, y + 22, '#22202a', 12, 4); px(x + 9, y - 42, '#2a2833', 14, 3); px(x + 10, y - 39, '#ffe6a0', 12, 10); px(x + 12, y - 37, '#fff6d8', 8, 6); px(x + 9, y - 29, '#2a2833', 14, 2); }

function pot(x, y) { px(x + 8, y + 10, '#8a4a2a', 16, 16); px(x + 6, y + 12, '#a35a33', 20, 10); px(x + 9, y + 8, '#6a3820', 14, 4); px(x + 10, y + 14, '#c27447', 3, 6); px(x + 7, y + 26, 'rgba(0,0,0,.3)', 18, 3); }

function shadow(x, y, w) { g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(x, y, w, 4, 0, 0, 6.28); g.fill(); }
function hero(x, y) { shadow(x + 11, y + 32, 10); spr(HERO, HERO_PAL, x, y);
  // shield on left arm, blade on right

/* ---------- HUD (original-style layout) ---------- */

  // energy meter
  px(14, 14, '#101018', 14, 50); px(16, 16, '#f0f0f0', 10, 46); px(18, 18, '#101018', 6, 42); px(18, 30, '#3ec05a', 6, 30); px(18, 30, '#7ef08f', 2, 30);

  px(44, 22, '#7a4a2a', 3, 18); px(47, 24, '#d8d8d8', 1, 14); for (let i = 0; i < 14; i++) px(47 + Math.sin(i / 13 * 3.14) * 9, 24 + i, '#8a5a32', 2, 1); // bow
  // counters
  g.font = 'bold 13px monospace'; g.textBaseline = 'top';
  const cnt = (x, icon, n) => { icon(x, 16); g.fillStyle = '#000'; g.fillText(n, x + 1, 33); g.fillStyle = '#fff'; g.fillText(n, x, 32); };
  cnt(84, (x, y) => { px(x + 4, y, '#3aa84a', 10, 12); px(x + 6, y + 2, '#7ee08a', 3, 8); px(x + 6, y + 4, '#fff', 6, 1); }, '$487');

  // LIFE + hearts
  g.font = 'bold 12px monospace'; g.fillStyle = '#000'; g.fillText('- LIFE -', 371, 13); g.fillStyle = '#ff5050'; g.fillText('- LIFE -', 370, 12);
  const heart = (x, y, f) => { const c = f === 1 ? '#e82838' : '#4a1a22', o = '#ffffff';
    ['.oo.oo.', 'occocco', 'occcccco', 'occcccco', '.occcco.', '..occo..', '...oo...'].forEach((r, j) => { for (let i = 0; i < r.length; i++) { if (r[i] === 'o') px(x + i, y + j, '#2a0a10'); else if (r[i] === 'c') px(x + i, y + j, f === .5 && i > 3 ? '#4a1a22' : c); } }); px(x + 2, y + 2, '#ff9aa0'); };
  for (let i = 0; i < 9; i++) heart(338 + (i % 10) * 10, 30, i < 6 ? 1 : i === 6 ? .5 : 0);
}

/* ---------- scenes ---------- */
function park(t) {
  // ground
  for (let y = 0; y < 14; y++) for (let x = 0; x < 16; x++) {
    const onPath = (y >= 7 && y <= 8) || (x >= 7 && x <= 8 && y >= 2);
    (onPath ? cobble : grass)(x * T, y * T, x * 31 + y * 17 + 1);
  }
  for (let x = 0; x < 16; x++) if (x < 6 || x > 9) { hedge(x * T, 10 * T, x * 13 + 5); }
  for (let y = 11; y < 14; y++) for (let x = 0; x < 16; x++) if ((x + y) % 5 === 0 && !(x >= 7 && x <= 8)) flowers(x * T, y * T, x * 3 + y * 11);
  for (let x = 1; x < 6; x++) if (x !== 3) flowers(x * T, 5 * T, x * 9 + 2);
  tree(-20, -36); tree(380, -40); tree(430, 150); tree(-30, 230);
  fountain(2 * T + 10, 2 * T - 4, t);
  stall(11 * T, 3 * T - 6);
  [[2, 9], [12, 9], [5, 6]].forEach(p => pot(p[0] * T, p[1] * T));
  sign(9 * T + 4, 9 * T + 6);
  goon(12 * T + 4, 6 * T + 10, true); goon(10 * T + 20, 8 * T + 30, true);
  hero(7 * T + 6, 7 * T + 2);
  lamp(6 * T + 10, 6 * T + 10); lamp(9 * T + 14, 6 * T + 10);
  // lighting: dusk tint, lamp glow, fireflies
  g.globalCompositeOperation = 'multiply'; g.fillStyle = '#7d6fb0'; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'lighter';
  const glow = (x, y, r, c) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); };
  glow(6 * T + 26, 6 * T - 24, 90, 'rgba(255,190,90,.55)'); glow(9 * T + 30, 6 * T - 24, 90, 'rgba(255,190,90,.55)');
  glow(3 * T + 58, 3 * T + 40, 70, 'rgba(90,180,255,.25)');
  seed = 99; for (let i = 0; i < 14; i++) { const fx = R() * W, fy = 60 + R() * 380; glow(fx, fy, 8, 'rgba(230,255,120,.8)'); px(fx, fy, '#f6ffb0', 2, 2); }
  g.globalCompositeOperation = 'source-over';
  // god rays
  g.globalCompositeOperation = 'screen'; for (let i = 0; i < 3; i++) { g.fillStyle = 'rgba(255,220,160,.06)'; g.beginPath(); g.moveTo(330 + i * 40, 0); g.lineTo(380 + i * 40, 0); g.lineTo(260 + i * 40, H); g.lineTo(200 + i * 40, H); g.fill(); }

function dungeon(t) {

  for (let y = 0; y < 14; y++) for (let x = 0; x < 16; x++) ((y < 3 || y > 12 || x < 1 || x > 14) ? wall : stone)(x * T, y * T, x * 7 + y * 13);

  px(12 * T + 2, 10 * T + 6, '#7a4a22', 28, 22); px(12 * T + 2, 10 * T + 6, '#a06a32', 28, 4); px(12 * T + 14, 10 * T + 12, '#e0c040', 4, 6); px(12 * T + 2, 10 * T + 16, '#5a3a1a', 28, 2);

  const slime = (x, y) => { shadow(x + 12, y + 18, 11); px(x + 2, y + 6, '#3ab84a', 20, 12); px(x + 4, y + 2, '#3ab84a', 16, 6); px(x + 6, y + 4, '#9af0a0', 4, 3); px(x + 8, y + 8, '#103a14', 3, 3); px(x + 14, y + 8, '#103a14', 3, 3); };
  slime(6 * T, 9 * T); slime(9 * T + 8, 10 * T + 4);
  hero(7 * T + 6, 5 * T + 10);
  // swing arc effect
  g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 3; g.beginPath(); g.arc(7 * T + 18, 5 * T + 32, 26, .1, 1.9); g.stroke();
  // darkness + light
  g.globalCompositeOperation = 'multiply'; g.fillStyle = '#5a5080'; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'lighter';
  const glow = (x, y, r, c) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); };
  glow(1 * T + 16, 3 * T + 4, 120, 'rgba(255,150,60,.55)'); glow(14 * T + 16, 3 * T + 4, 120, 'rgba(255,150,60,.55)'); glow(1 * T + 16, 11 * T, 110, 'rgba(255,150,60,.5)'); glow(14 * T + 16, 11 * T, 110, 'rgba(255,150,60,.5)');
  glow(7 * T + 18, 5 * T + 20, 110, 'rgba(255,220,150,.45)'); // lantern
  glow(12 * T + 16, 10 * T + 16, 30, 'rgba(255,220,80,.3)');
  g.globalCompositeOperation = 'source-over';
