<!doctype html><html><head><meta charset="utf-8"><title>Legend of Varrowmere - dev</title><style>body{margin:0;background:#000}</style></head><body>
<script>/* ================= Legend of Varrowmere: engine core =================
   Fixed 60 Hz simulation, decoupled rendering, input, maths helpers.
   Internal resolution 256 x 224: 16 x 14 tiles of 16 px, the original's SNES screen. */
'use strict';
const LV = {};
LV.TILE = 16;
LV.VIEW_W = 256;
LV.VIEW_H = 224;
LV.STEP = 1 / 60;

/* ---------- maths ---------- */
LV.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
LV.sign = function (v) { return v > 0 ? 1 : v < 0 ? -1 : 0; };
LV.lerp = function (a, b, t) { return a + (b - a) * t; };
// Axis-aligned boxes: { x, y, w, h } with x,y the top-left corner, in world pixels.
LV.overlap = function (a, b) { return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; };
LV.boxCentre = function (b) { return { x: b.x + b.w / 2, y: b.y + b.h / 2 }; };
// Directions: 0 up, 1 right, 2 down, 3 left (the original's four facings).
LV.DIRS = [{ x: 0, y: -1 }, { x: 1, y: 0 }, { x: 0, y: 1 }, { x: -1, y: 0 }];
LV.dirFromVec = function (x, y, prev) {
  if (!x && !y) return prev;
  if (Math.abs(x) > Math.abs(y)) return x > 0 ? 1 : 3;
  if (Math.abs(y) > Math.abs(x)) return y > 0 ? 2 : 0;
  // exact diagonal: keep the previous facing if it is one of the two, as the original does
  const a = x > 0 ? 1 : 3, b = y > 0 ? 2 : 0;
  return prev === a || prev === b ? prev : b;
};
// Seeded random (deterministic drops and patterns for tests).
LV.rng = function (seed) { let s = seed >>> 0 || 1; return function () { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1e9) / 1e9; }; };

/* ---------- input ----------
   Logical buttons: up down left right, attack, item, action, map, menu.
   held[b] = currently down; pressed[b] = went down this step (cleared after each step). */
LV.Input = function () {
  this.held = {}; this.pressed = {}; this._queue = [];
  this.map = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    KeyZ: 'attack', KeyJ: 'attack', KeyX: 'item', KeyK: 'item', KeyC: 'action', KeyL: 'action', KeyM: 'map', Enter: 'menu', Escape: 'menu'
  };
};
LV.Input.prototype.down = function (b) { if (!this.held[b]) this._queue.push(b); this.held[b] = true; };
LV.Input.prototype.up = function (b) { this.held[b] = false; };
LV.Input.prototype.key = function (code, isDown) { const b = this.map[code]; if (!b) return false; if (isDown) this.down(b); else this.up(b); return true; };
LV.Input.prototype.beginStep = function () { this.pressed = {}; for (const b of this._queue) this.pressed[b] = true; this._queue = []; };
LV.Input.prototype.axis = function () {
  const x = (this.held.right ? 1 : 0) - (this.held.left ? 1 : 0), y = (this.held.down ? 1 : 0) - (this.held.up ? 1 : 0);
  return { x: x, y: y };
};
LV.Input.prototype.clear = function () { this.held = {}; this.pressed = {}; this._queue = []; };

/* ---------- game loop ----------
   update(dt) runs at a fixed 60 Hz however fast the screen refreshes; render(alpha) draws once per frame. */
LV.Loop = function (update, render) { this.update = update; this.render = render; this.acc = 0; this.last = 0; this.raf = 0; this.running = false; this.speed = 1; };
LV.Loop.prototype.start = function () {
  if (this.running) return; this.running = true; this.last = 0;
  const self = this;
  const frame = function (t) {
    if (!self.running) return;
    if (!self.last) self.last = t;
    let dt = Math.min(0.1, (t - self.last) / 1000) * self.speed; self.last = t;
    self.acc += dt; let n = 0;
    while (self.acc >= LV.STEP && n < 8) { self.update(LV.STEP); self.acc -= LV.STEP; n++; }
    if (n === 8) self.acc = 0;
    self.render(self.acc / LV.STEP);
    self.raf = requestAnimationFrame(frame);
  };
  this.raf = requestAnimationFrame(frame);
};
LV.Loop.prototype.stop = function () { this.running = false; cancelAnimationFrame(this.raf); };

/* ================= World: maps, collision, drawing tiles =================
   Maps come from tools/maps.py (src/data/maps.json). Art comes from the CC0 pack sheets in LV.IMG. */
LV.C = { OPEN: 0, SOLID: 1, DEEP: 2, PIT: 3, LEDGE: 4, LOW: 5, BUSH: 6, ROCK: 7, SHALLOW: 8 };
LV.SHEETS = ['overworld', 'inner', 'cave', 'objects'];

LV.World = function (def) {
  this.def = def; this.id = def.id; this.name = def.name; this.w = def.w; this.h = def.h;
  this.col = def.col.slice();
  this.layers = { ground: def.layers.ground.slice(), deco: def.layers.deco.slice(), over: def.layers.over.slice() };
  this.areas = def.areas; this.warps = def.warps; this.signs = def.signs; this.chests = def.chests;
  this.indoor = def.indoor; this.dark = def.dark; this.cache = {};
};
LV.World.prototype.inside = function (tx, ty) { return tx >= 0 && ty >= 0 && tx < this.w && ty < this.h; };
LV.World.prototype.c = function (tx, ty) { return this.inside(tx, ty) ? this.col[ty * this.w + tx] : LV.C.SOLID; };
LV.World.prototype.setC = function (tx, ty, v) { if (this.inside(tx, ty)) this.col[ty * this.w + tx] = v; };
LV.World.prototype.cAt = function (px, py) { return this.c(Math.floor(px / LV.TILE), Math.floor(py / LV.TILE)); };
// Blocks walking? (flying things ignore pits and water; projectiles pass low walls)
LV.World.prototype.blocks = function (code, mode) {
  const C = LV.C;
  if (code === C.SOLID || code === C.BUSH || code === C.ROCK) return true;
  if (code === C.LOW) return mode !== 'shot';
  if (code === C.LEDGE) return mode === 'enemy';
  if (code === C.DEEP || code === C.PIT) return mode === 'enemy';
  return false;
};
LV.World.prototype.boxBlocked = function (b, mode) {
  const T = LV.TILE, x0 = Math.floor(b.x / T), y0 = Math.floor(b.y / T), x1 = Math.floor((b.x + b.w - 0.01) / T), y1 = Math.floor((b.y + b.h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (this.blocks(this.c(tx, ty), mode)) return true;
  return false;
};
LV.World.prototype.areaAt = function (px, py) {
  const tx = px / LV.TILE, ty = py / LV.TILE;
  for (const a of this.areas) if (tx >= a[0] && ty >= a[1] && tx < a[0] + a[2] && ty < a[1] + a[3]) return a;
  return this.areas[0];
};
LV.World.prototype.warpAt = function (tx, ty) { return this.warps.find(function (w) { return w.x === tx && w.y === ty; }) || null; };
// Cutting a bush / lifting a rock leaves grass behind
LV.World.prototype.clearTile = function (tx, ty) {
  if (!this.inside(tx, ty)) return;
  const i = ty * this.w + tx; this.layers.deco[i] = -1; this.col[i] = LV.C.OPEN;
};

/* Draw one layer for the visible part of the map. ox, oy = camera position in px. */
LV.drawLayer = function (ctx, world, name, ox, oy) {
  const T = LV.TILE, L = world.layers[name], img = LV.IMG;
  const x0 = Math.max(0, Math.floor(ox / T)), y0 = Math.max(0, Math.floor(oy / T));
  const x1 = Math.min(world.w - 1, Math.floor((ox + LV.VIEW_W) / T)), y1 = Math.min(world.h - 1, Math.floor((oy + LV.VIEW_H) / T));
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const r = L[ty * world.w + tx]; if (r < 0) continue;
    const sh = img[LV.SHEETS[r >> 16]]; if (!sh) continue;
    ctx.drawImage(sh, (r & 255) * T, ((r >> 8) & 255) * T, T, T, Math.round(tx * T - ox), Math.round(ty * T - oy), T, T);
  }
};

/* ================= Actors, movement and combat =================
   Every actor: x, y = centre of its feet (px). body = box for walls (at the feet). hurt = box that takes damage.
   Attacks are boxes checked each step against hurt boxes. Damage is in quarter hearts (4 = one heart). */
LV.box = function (e, r) { return { x: e.x + r[0], y: e.y + r[1], w: r[2], h: r[3] }; };

LV.Actor = function (o) {
  this.x = o.x; this.y = o.y; this.dir = o.dir === undefined ? 2 : o.dir;
  this.body = o.body || [-6, -6, 12, 6]; this.hurt = o.hurt || [-6, -18, 12, 18];
  this.hp = o.hp || 1; this.maxHp = this.hp; this.team = o.team || 'enemy';
  this.inv = 0; this.kb = 0; this.kbx = 0; this.kby = 0; this.dead = false; this.t = 0; this.stun = 0;
  this.contact = o.contact || 0; this.kind = o.kind || 'actor';
};
LV.Actor.prototype.bodyBox = function () { return LV.box(this, this.body); };
LV.Actor.prototype.hurtBox = function () { return LV.box(this, this.hurt); };

/* Move with tile collision one axis at a time (slide along walls).
   With nudge, walking straight into a wall corner slips you round it, as in the original. */
LV.move = function (e, world, dx, dy, mode, nudge) {
  const one = function (ax, d) {
    if (!d) return true;
    const n = Math.max(1, Math.ceil(Math.abs(d))), part = d / n;
    for (let i = 0; i < n; i++) {
      if (ax === 'x') e.x += part; else e.y += part;
      if (world.boxBlocked(e.bodyBox(), mode)) { if (ax === 'x') e.x -= part; else e.y -= part; return false; }
    }
    return true;
  };
  const okx = one('x', dx), oky = one('y', dy);
  if (nudge && ((!okx && dx && !dy) || (!oky && dy && !dx))) {
    for (let s = 1; s <= 7; s++) for (const sg of [-1, 1]) {
      const b = e.bodyBox();
      if (dx) { b.y += sg * s; } else { b.x += sg * s; }
      const ahead = { x: b.x + (dx ? LV.sign(dx) : 0), y: b.y + (dy ? LV.sign(dy) : 0), w: b.w, h: b.h };
      if (!world.boxBlocked(b, mode) && !world.boxBlocked(ahead, mode)) {
        if (dx) e.y += sg; else e.x += sg;
        return { x: okx, y: oky, nudged: true };
      }
    }
  }
  return { x: okx, y: oky };
};

/* An attack. kind: blade spin arrow bomb fire contact thrown; power in quarter hearts (or hits for enemies);
   tier: shield level needed to block it (0 = can't be blocked). from: point used for knockback and shield facing. */
LV.Hit = function (o) {
  this.team = o.team; this.kind = o.kind; this.power = o.power || 1; this.tier = o.tier || 0;
  this.box = o.box; this.from = o.from; this.done = o.done || new Set(); this.knock = o.knock === undefined ? 1 : o.knock;
};

LV.applyHit = function (game, hit, t) {
  if (t.dead || t.team === hit.team || hit.done.has(t) || t.inv > 0) return null;
  hit.done.add(t);
  if (t.isHero && hit.tier && t.blocks(hit)) { game.sfx('clink'); return 'blocked'; }
  if (t.immune && t.immune.indexOf(hit.kind) >= 0) { game.sfx('clink'); return 'immune'; }
  const dmg = t.isHero ? Math.max(1, Math.round(hit.power * t.armour())) : hit.power;
  t.hp -= dmg;
  const ax = t.x - hit.from.x, ay = (t.y - 8) - hit.from.y, len = Math.hypot(ax, ay) || 1;
  if (hit.knock && !t.heavy) { t.kb = t.isHero ? 0.16 : 0.14; t.kbx = ax / len * 220; t.kby = ay / len * 220; }
  t.inv = t.isHero ? 1.0 : 0.25;
  if (t.hp <= 0) { t.hp = 0; if (t.isHero) game.heroDown(); else game.kill(t); }
  else game.sfx(t.isHero ? 'hurt' : 'hit');
  return 'hit';
};

/* ---------- the hero ----------
   States: walk, attack, charge (blade held), spin, hurt (knockback), fall (pit/deep water), lift, carry, read. */
LV.Hero = function (x, y) {
  LV.Actor.call(this, { x: x, y: y, team: 'hero', hp: 12, body: [-5, -6, 10, 6], hurt: [-6, -18, 12, 18] });
  this.isHero = true; this.kind = 'hero'; this.state = 'walk'; this.st = 0; this.anim = 0; this.moving = false;
  this.blade = 1; this.shield = 1; this.armourLv = 0; this.charge = 0; this.hitSet = null; this.carry = null;
  this.safe = { x: x, y: y };    // last safe spot (respawn after pits)
};
LV.Hero.prototype = Object.create(LV.Actor.prototype);
LV.Hero.prototype.armour = function () { return [1, 0.5, 0.25][this.armourLv]; };
LV.Hero.prototype.canShield = function () { return this.shield > 0 && (this.state === 'walk' || this.state === 'charge'); };
// Shield blocks projectiles hitting from the front (within the facing half), as in the original
LV.Hero.prototype.blocks = function (hit) {
  if (!this.canShield() || this.shield < hit.tier) return false;
  const d = LV.DIRS[this.dir], fx = hit.from.x - this.x, fy = hit.from.y - (this.y - 8);
  return fx * d.x + fy * d.y > Math.abs(d.x ? fy : fx) * 0.5;
};
// Blade: angle (degrees, 0 = right, 90 = down) for each of the 4 swing frames, per facing (0 up,1 right,2 down,3 left)
LV.SWING = [[0, -45, -90, -90], [90, 45, 0, 0], [180, 135, 90, 90], [90, 135, 180, 180]];
LV.SWING_T = 0.24;
LV.Hero.prototype.bladeBox = function (angleDeg, reach) {
  const a = angleDeg * Math.PI / 180, cx = this.x + Math.cos(a) * reach, cy = this.y - 8 + Math.sin(a) * reach;
  return { x: cx - 7, y: cy - 7, w: 14, h: 14 };
};
LV.Hero.prototype.update = function (g, dt) {
  const inp = g.input; this.t += dt; this.st += dt;
  if (this.inv > 0) this.inv -= dt;
  if (this.kb > 0) { this.kb -= dt; LV.move(this, g.world, this.kbx * dt, this.kby * dt, 'hero'); if (this.kb <= 0 && this.state === 'hurt') this.state = 'walk'; return; }
  const ax = inp.axis();
  switch (this.state) {
    case 'walk': {
      if (inp.pressed.attack) { this.startAttack(g); return; }
      if (inp.pressed.action) { if (g.interact(this)) return; }
      if (inp.pressed.item) { g.useItem(this); if (this.state !== 'walk') return; }
      const sp = 84, len = Math.hypot(ax.x, ax.y) || 1;
      this.moving = !!(ax.x || ax.y);
      if (this.moving) {
        this.dir = LV.dirFromVec(ax.x, ax.y, this.dir);
        const r = LV.move(this, g.world, ax.x / len * sp * dt, ax.y / len * sp * dt, 'hero', true);
        this.pushing = (!r.x && ax.x && !ax.y) || (!r.y && ax.y && !ax.x);
        this.anim += dt * 8;
      } else { this.anim = 0; this.pushing = false; }
      this.checkGround(g);
      break;
    }
    case 'attack': {
      const f = Math.min(3, Math.floor(this.st / LV.SWING_T * 4));
      const hit = new LV.Hit({ team: 'hero', kind: 'blade', power: this.blade, from: { x: this.x, y: this.y - 8 }, box: this.bladeBox(LV.SWING[this.dir][f], 13), done: this.hitSet });
      g.resolveHit(hit, true);
      if (this.st >= LV.SWING_T) {
        if (inp.held.attack) { this.state = 'charge'; this.st = 0; this.charge = 0; }
        else { this.state = 'walk'; this.st = 0; }
      }
      break;
    }
    case 'charge': {   // blade held out: walk slowly without turning, release when charged for a Spin Attack
      this.charge += dt;
      const sp = 50, len = Math.hypot(ax.x, ax.y) || 1;
      if (ax.x || ax.y) { LV.move(this, g.world, ax.x / len * sp * dt, ax.y / len * sp * dt, 'hero', true); this.anim += dt * 6; }
      // poke: the held blade still hurts what it touches
      g.resolveHit(new LV.Hit({ team: 'hero', kind: 'blade', power: this.blade, from: { x: this.x, y: this.y - 8 }, box: this.bladeBox(LV.SWING[this.dir][3], 12), done: new Set() }), true, true);
      if (!inp.held.attack) {
        if (this.charge >= 0.8) { this.state = 'spin'; this.st = 0; this.hitSet = new Set(); g.sfx('spin'); }
        else { this.state = 'walk'; this.st = 0; }
      }
      this.checkGround(g);
      break;
    }
    case 'spin': {
      const T = 0.42, a = (LV.SWING[this.dir][2] + this.st / T * 360);
      g.resolveHit(new LV.Hit({ team: 'hero', kind: 'spin', power: this.blade * 2, from: { x: this.x, y: this.y - 8 }, box: this.bladeBox(a, 15), done: this.hitSet }), true);
      if (this.st >= T) { this.state = 'walk'; this.st = 0; }
      break;
    }
    case 'item': { if (this.st > 0.2) { this.state = 'walk'; this.st = 0; } break; }
    case 'fall': {
      if (this.st > 0.6) { this.x = this.safe.x; this.y = this.safe.y; this.state = 'walk'; this.st = 0; this.hp -= 2; this.inv = 0.8; g.sfx('hurt'); if (this.hp <= 0) { this.hp = 0; g.heroDown(); } }
      break;
    }
    case 'carry': {
      if (inp.pressed.action || inp.pressed.attack) { g.throwCarried(this); this.state = 'walk'; break; }
      const sp = 70, len = Math.hypot(ax.x, ax.y) || 1;
      this.moving = !!(ax.x || ax.y);
      if (this.moving) { this.dir = LV.dirFromVec(ax.x, ax.y, this.dir); LV.move(this, g.world, ax.x / len * sp * dt, ax.y / len * sp * dt, 'hero', true); this.anim += dt * 7; }
      this.checkGround(g);
      break;
    }
  }
};
LV.Hero.prototype.startAttack = function (g) {
  this.state = 'attack'; this.st = 0; this.hitSet = new Set(); g.sfx('swing');
};
// Pits and deep water: fall in and come back at the last safe spot. Otherwise remember this spot as safe.
LV.Hero.prototype.checkGround = function (g) {
  const c = g.world.cAt(this.x, this.y - 3);
  if (c === LV.C.PIT || (c === LV.C.DEEP && !g.save.items.fins)) { this.state = 'fall'; this.st = 0; g.sfx(c === LV.C.PIT ? 'fall' : 'splash'); return; }
  const cs = [g.world.cAt(this.x - 5, this.y - 6), g.world.cAt(this.x + 5, this.y - 6), g.world.cAt(this.x - 5, this.y - 1), g.world.cAt(this.x + 5, this.y - 1)];
  if (cs.every(function (v) { return v === LV.C.OPEN || v === LV.C.SHALLOW; })) { this.safe.x = this.x; this.safe.y = this.y; }
};
// Sprite frame from the pack sheet: walk rows 0 down,1 right,2 up,3 left (16x32); attack rows 4 down,5 up,6 right,7 left (32x32)
LV.HERO_ROW = [2, 1, 0, 3];
LV.ATK_ROW = [1, 2, 0, 3];   // index into the 4 attack rows (sheet rows 4 down, 5 up, 6 right, 7 left)
LV.Hero.prototype.draw = function (ctx, ox, oy) {
  if (this.inv > 0 && Math.floor(this.inv * 20) % 2 && this.state !== 'fall') return;
  const img = LV.IMG.hero, X = Math.round(this.x - ox), Y = Math.round(this.y - oy);
  if (this.state === 'fall') { const s = Math.max(0, 1 - this.st / 0.6); const w = 16 * s, h = 32 * s; ctx.drawImage(img, 0, 0, 16, 32, X - w / 2, Y - h * 0.9, w, h); return; }
  if (this.state === 'attack' || this.state === 'spin') {
    let f = Math.min(3, Math.floor(this.st / LV.SWING_T * 4)), d = this.dir;
    if (this.state === 'spin') { d = [2, 1, 0, 3][Math.floor(this.st / 0.42 * 4) % 4]; f = 2; }
    ctx.drawImage(img, f * 32, 128 + LV.ATK_ROW[d] * 32, 32, 32, X - 16, Y - 28, 32, 32);
    return;
  }
  if (this.state === 'item') { ctx.drawImage(img, 0, LV.HERO_ROW[this.dir] * 32, 16, 32, X - 8, Y - 28, 16, 32); return; }
  if (this.state === 'charge') { ctx.drawImage(img, 3 * 32, 128 + LV.ATK_ROW[this.dir] * 32, 32, 32, X - 16, Y - 28, 32, 32); if (this.charge >= 0.8 && Math.floor(this.t * 16) % 2) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(X - 1, Y - 30, 2, 2); } return; }
  let col = this.moving ? Math.floor(this.anim) % 4 : 0;
  if (this.state === 'carry') col = 9 + (this.moving ? Math.floor(this.anim) % 4 : 0);
  else if (this.pushing) col = 5 + Math.floor(this.anim / 2) % 3;
  ctx.drawImage(img, col * 16, LV.HERO_ROW[this.dir] * 32, 16, 32, X - 8, Y - 28, 16, 32);
};

/* ---------- enemies ---------- */
LV.ENEMIES = {};
// The living log: sleeps until you come close, then waddles after you. Touching it costs half a heart.
LV.ENEMIES.log = function (x, y) {
  const e = new LV.Actor({ x: x, y: y, hp: 3, contact: 2, body: [-6, -6, 12, 6], hurt: [-7, -20, 14, 20], kind: 'log' });
  e.state = 'sleep'; e.speed = 34; e.wander = 0; e.wx = 0; e.wy = 0; e.drop = true; e.weakToDice = true;
  e.update = function (g, dt) {
    this.t += dt; if (this.inv > 0) this.inv -= dt;
    if (this.kb > 0) { this.kb -= dt; LV.move(this, g.world, this.kbx * dt, this.kby * dt, 'enemy'); return; }
    if (this.stun > 0) { this.stun -= dt; return; }
    const h = g.hero, dx = h.x - this.x, dy = h.y - this.y, d = Math.hypot(dx, dy);
    if (this.state === 'sleep') { if (d < 56) { this.state = 'wake'; this.t = 0; } return; }
    if (this.state === 'wake') { if (this.t > 0.5) { this.state = 'chase'; this.t = 0; } return; }
    if (d > 120) { this.state = 'sleep'; return; }
    const vx = dx / (d || 1) * this.speed * dt, vy = dy / (d || 1) * this.speed * dt;
    LV.move(this, g.world, vx, vy, 'enemy');
    this.dir = LV.dirFromVec(dx, dy, this.dir);
  };
  e.draw = function (ctx, ox, oy) {
    if (this.inv > 0 && Math.floor(this.inv * 30) % 2) return;
    const row = [1, 2, 0, 3][this.dir];
    const col = this.state === 'sleep' ? 4 : this.state === 'wake' ? 5 : Math.floor(this.t * 6) % 4;
    ctx.drawImage(LV.IMG.log, col * 32, (this.state === 'sleep' || this.state === 'wake' ? 0 : row) * 32, 32, 32, Math.round(this.x - ox - 16), Math.round(this.y - oy - 28), 32, 32);
  };
  return e;
};

/* ---------- pickups and effects ---------- */
LV.Pickup = function (x, y, kind) { this.x = x; this.y = y; this.kind = kind; this.t = 0; this.dead = false; this.life = 8; };
LV.Pickup.prototype.box = function () { return { x: this.x - 5, y: this.y - 8, w: 10, h: 9 }; };
LV.Pickup.prototype.update = function (g, dt) { this.t += dt; if (this.t > this.life) this.dead = true; };
LV.Pickup.prototype.draw = function (ctx, ox, oy) {
  if (this.t > this.life - 2 && Math.floor(this.t * 10) % 2) return;
  const b = Math.abs(Math.sin(Math.min(this.t, 0.6) * 8)) * Math.max(0, 4 - this.t * 7), X = Math.round(this.x - ox), Y = Math.round(this.y - oy - b);
  const o = LV.IMG.objects;
  if (this.kind === 'heart') ctx.drawImage(o, 0, 48, 16, 16, X - 8, Y - 12, 16, 16);
  else ctx.drawImage(o, this.kind === 'cash5' ? 16 : 0, 64, 16, 16, X - 8, Y - 12, 16, 16);
};
LV.Effect = function (x, y, kind) { this.x = x; this.y = y; this.kind = kind; this.t = 0; this.dead = false; };
LV.Effect.prototype.update = function (g, dt) { this.t += dt; if (this.t > 0.4) this.dead = true; };
LV.Effect.prototype.draw = function (ctx, ox, oy) {
  const f = Math.min(5, Math.floor(this.t / 0.4 * 6)), X = Math.round(this.x - ox), Y = Math.round(this.y - oy);
  // poof: the pack's smoke frames (objects sheet row 4, 32 px apart)
  ctx.drawImage(LV.IMG.objects, 64 + f * 32, 64, 32, 32, X - 16, Y - 24, 32, 32);
};

/* ================= The game: state, camera, rules, drawing =================
   One Game owns the canvas, the current world, the hero and everything in it. */
LV.Game = function (canvas, opts) {
  opts = opts || {};
  this.canvas = canvas; this.ctx = canvas.getContext('2d'); this.ctx.imageSmoothingEnabled = false;
  this.input = new LV.Input(); this.store = opts.store || LV.memoryStore();
  this.save = this.store.get() || LV.newSave();
  this.actors = []; this.pickups = []; this.effects = []; this.shots = [];
  this.cam = { x: 0, y: 0 }; this.scroll = null; this.fade = 0; this.fadeTo = null;
  this.dialog = null; this.paused = false; this.t = 0; this.rng = LV.rng(opts.seed || 1234);
  this.muted = !!opts.muted; this.audio = null;
  this.enter(this.save.map, this.save.x, this.save.y, this.save.dir, true);
};
LV.newSave = function () {
  return { map: 'meadow', x: 8 * 16 + 8, y: 8 * 16 + 12, dir: 2, hp: 12, maxHp: 12, cash: 0, bombs: 0, arrows: 0, keys: {},
    items: {}, opened: {}, cut: {}, flags: {}, shards: 0, time: 0 };
};
LV.memoryStore = function () { let d = null; return { get: function () { return d && JSON.parse(d); }, set: function (v) { d = JSON.stringify(v); } }; };

/* ---------- moving between maps ---------- */
LV.Game.prototype.enter = function (mapId, x, y, dir, first) {
  const def = LV.MAPS[mapId]; this.world = new LV.World(def);
  // things already opened or cut stay that way
  const self = this;
  Object.keys(this.save.opened).forEach(function (k) { const p = k.split(':'); if (p[0] === mapId) { const xy = p[1].split(','); self.world.layers.deco[+xy[1] * self.world.w + +xy[0]] = LV.CHEST_OPEN; } });
  if (!this.hero) this.hero = new LV.Hero(x, y);
  const h = this.hero; h.x = x; h.y = y; h.dir = dir === undefined ? h.dir : dir; h.safe = { x: x, y: y }; h.state = 'walk'; h.kb = 0;
  if (first) { h.hp = this.save.hp; h.maxHp = this.save.maxHp; }
  this.actors = []; this.pickups = []; this.effects = []; this.shots = [];
  def.spawns.forEach(function (s) { const mk = LV.ENEMIES[s.kind]; if (mk) self.actors.push(mk(s.x * 16 + 8, s.y * 16 + 14)); });
  this.area = this.world.areaAt(h.x, h.y - 8); this.cam = this.camFor(this.area);
  this.save.map = mapId;
};
LV.Game.prototype.camFor = function (a) {
  const T = LV.TILE, h = this.hero;
  const x = LV.clamp(h.x - LV.VIEW_W / 2, a[0] * T, (a[0] + a[2]) * T - LV.VIEW_W), y = LV.clamp(h.y - 8 - LV.VIEW_H / 2, a[1] * T, (a[1] + a[3]) * T - LV.VIEW_H);
  return { x: x, y: y };
};
LV.CHEST_OPEN = (3 << 16) | (0 << 8) | 1;

/* ---------- one simulation step ---------- */
LV.Game.prototype.update = function (dt) {
  this.input.beginStep(); this.t += dt; this.save.time += dt;
  if (this.fadeTo) { this.fade += dt * 4; if (this.fade >= 1) { const f = this.fadeTo; this.fadeTo = null; f(); } return; }
  if (this.fade > 0) { this.fade = Math.max(0, this.fade - dt * 4); }
  if (this.dialog) { if (this.input.pressed.attack || this.input.pressed.action) this.nextDialog(); return; }
  if (this.paused) { this.menuUpdate(); return; }
  if (this.input.pressed.menu) { this.paused = true; this.menu = null; this.sfx('door'); return; }
  if (this.shake > 0) this.shake -= dt;
  if (this.scroll) { this.stepScroll(dt); return; }
  const h = this.hero;
  h.update(this, dt);
  for (const a of this.actors) a.update(this, dt);
  for (const s of this.shots) s.update(this, dt);
  for (const p of this.pickups) p.update(this, dt);
  for (const e of this.effects) e.update(this, dt);
  // enemies touching the hero
  if (h.inv <= 0 && h.state !== 'fall') for (const a of this.actors) if (!a.dead && a.contact && LV.overlap(a.hurtBox(), h.hurtBox()))
    LV.applyHit(this, new LV.Hit({ team: 'enemy', kind: 'contact', power: a.contact, from: { x: a.x, y: a.y - 8 } }), h);
  // pick things up
  for (const p of this.pickups) if (!p.dead && LV.overlap(p.box(), h.hurtBox())) this.collect(p);
  this.actors = this.actors.filter(function (a) { return !a.dead; });
  this.pickups = this.pickups.filter(function (p) { return !p.dead; });
  this.effects = this.effects.filter(function (e) { return !e.dead; });
  this.shots = this.shots.filter(function (s) { return !s.dead; });
  this.checkEdges(); this.checkWarp();
  this.cam = this.camFor(this.area);
};

/* ---------- combat rules ---------- */
// A hero attack: hurts enemies, cuts bushes. poke = held blade (no bush cutting spam).
LV.Game.prototype.resolveHit = function (hit, fromHero, poke) {
  for (const a of this.actors) if (!a.dead && LV.overlap(hit.box, a.hurtBox())) LV.applyHit(this, hit, a);
  if (fromHero && !poke && (hit.kind === 'blade' || hit.kind === 'spin')) {
    const T = LV.TILE, b = hit.box, x0 = Math.floor(b.x / T), y0 = Math.floor(b.y / T), x1 = Math.floor((b.x + b.w - 1) / T), y1 = Math.floor((b.y + b.h - 1) / T);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (this.world.c(tx, ty) === LV.C.BUSH) this.cutBush(tx, ty);
  }
};
LV.Game.prototype.cutBush = function (tx, ty) {
  this.world.clearTile(tx, ty); this.effects.push(new LV.Effect(tx * 16 + 8, ty * 16 + 14, 'leaves')); this.sfx('cut');
  this.dropLoot(tx * 16 + 8, ty * 16 + 12, 0.35);
};
LV.Game.prototype.kill = function (a) {
  a.dead = true; this.effects.push(new LV.Effect(a.x, a.y, 'poof')); this.sfx('kill');
  if (a.drop) this.dropLoot(a.x, a.y, 0.6);
};
// The original's drop table, simplified: hearts when hurt, otherwise cash
LV.Game.prototype.dropLoot = function (x, y, chance) {
  const r = this.rng(); if (r > chance) return;
  const hurt = this.hero.hp < this.hero.maxHp;
  const kind = hurt && this.rng() < 0.5 ? 'heart' : this.rng() < 0.2 ? 'cash5' : 'cash1';
  this.pickups.push(new LV.Pickup(x, y, kind));
};
LV.Game.prototype.collect = function (p) {
  p.dead = true; const h = this.hero;
  if (p.kind === 'heart') { h.hp = Math.min(h.maxHp, h.hp + 4); this.sfx('heart'); }
  else { this.save.cash = Math.min(999, this.save.cash + (p.kind === 'cash5' ? 5 : 1)); this.sfx('cash'); }
};
LV.Game.prototype.heroDown = function () {
  const self = this; this.sfx('down');
  this.say(['You were hospitalized by a ' + (this.lastHitBy || 'nasty fall') + '.', 'The nurse patches you up. Your cash is safe... this time.'], function () {
    self.fadeTo = function () { self.hero.hp = 12; self.enter('home', 7 * 16 + 8, 11 * 16 + 12, 2); };
  });
};

/* ---------- talking, reading, chests, lifting ---------- */
LV.Game.prototype.interact = function (h) {
  const d = LV.DIRS[h.dir], tx = Math.floor((h.x + d.x * 12) / 16), ty = Math.floor((h.y - 4 + d.y * 12) / 16), w = this.world;
  const key = tx + ',' + ty;
  if (w.signs[key]) { this.say(w.signs[key].split('|')); return true; }
  const ch = w.chests[key];
  if (ch && !this.save.opened[w.id + ':' + key] && h.dir === 0) { this.openChest(w.id, key, tx, ty, ch); return true; }
  const c = w.c(tx, ty);
  if (c === LV.C.BUSH) { w.clearTile(tx, ty); h.state = 'carry'; h.carry = 'bush'; this.sfx('lift'); this.dropLoot(tx * 16 + 8, ty * 16 + 12, 0.3); return true; }
  return false;
};
LV.ITEM_NAMES = { lantern: ['You got the Lantern!', 'Light up dark rooms and torches.'], heart_shard: ['You got a Heart Shard!', 'Collect four to gain a whole heart.'] };
LV.Game.prototype.openChest = function (mapId, key, tx, ty, ch) {
  this.save.opened[mapId + ':' + key] = 1; this.world.layers.deco[ty * this.world.w + tx] = LV.CHEST_OPEN; this.sfx('chest');
  const it = ch.item, s = this.save;
  if (it === 'heart_shard') { s.shards++; if (s.shards % 4 === 0) { s.maxHp += 4; this.hero.maxHp = s.maxHp; this.hero.hp = s.maxHp; } }
  else s.items[it] = 1;
  this.say(LV.ITEM_NAMES[it] || ['You got ' + it + '!']);
};
LV.Game.prototype.throwCarried = function (h) {
  const d = LV.DIRS[h.dir], g = this;
  const shot = { x: h.x, y: h.y - 14, vx: d.x * 180, vy: d.y * 180, t: 0, dead: false,
    update: function (game, dt) {
      this.t += dt; this.x += this.vx * dt; this.y += this.vy * dt;
      const b = { x: this.x - 6, y: this.y - 6, w: 12, h: 12 };
      const hit = new LV.Hit({ team: 'hero', kind: 'thrown', power: 2, from: { x: this.x - this.vx, y: this.y - this.vy }, box: b });
      let hitSomething = false;
      for (const a of game.actors) if (!a.dead && LV.overlap(b, a.hurtBox())) { LV.applyHit(game, hit, a); hitSomething = true; }
      if (hitSomething || this.t > 0.32 || game.world.boxBlocked({ x: this.x - 2, y: this.y + 6, w: 4, h: 4 }, 'shot')) { this.dead = true; game.effects.push(new LV.Effect(this.x, this.y + 10, 'leaves')); game.sfx('cut'); }
    },
    draw: function (ctx, ox, oy) { ctx.drawImage(LV.IMG.overworld, 0, 16 * 16, 16, 16, Math.round(this.x - ox - 8), Math.round(this.y - oy - 8), 16, 16); } };
  this.shots.push(shot); h.carry = null; this.sfx('throw'); void g;
};

/* ---------- dialog box ---------- */
LV.Game.prototype.say = function (lines, then) { this.dialog = { lines: lines.slice(), i: 0, then: then || null }; };
LV.Game.prototype.nextDialog = function () {
  const d = this.dialog; d.i++;
  if (d.i >= d.lines.length) { this.dialog = null; if (d.then) d.then(); }
};

/* ---------- screen edges, scrolling and warps ---------- */
LV.Game.prototype.checkEdges = function () {
  const h = this.hero, a = this.area, T = LV.TILE;
  let dir = -1;
  if (h.x < a[0] * T + 1) dir = 3; else if (h.x > (a[0] + a[2]) * T - 1) dir = 1;
  else if (h.y - 3 < a[1] * T + 1) dir = 0; else if (h.y > (a[1] + a[3]) * T - 1) dir = 2;
  if (dir < 0) return;
  const d = LV.DIRS[dir], nx = h.x + d.x * 10, ny = h.y + d.y * 12;
  const next = this.world.areaAt(nx, ny - 3);
  if (next === a || nx < 0 || ny < 0 || nx > this.world.w * T || ny > this.world.h * T) { h.x = LV.clamp(h.x, a[0] * T + 2, (a[0] + a[2]) * T - 2); h.y = LV.clamp(h.y, a[1] * T + 5, (a[1] + a[3]) * T - 1); return; }
  // slide the camera to the next screen, walking the hero across, as in the original
  const from = { x: this.cam.x, y: this.cam.y }; this.area = next;
  this.scroll = { t: 0, from: from, dir: dir, hx: h.x, hy: h.y, tx: h.x + d.x * 20, ty: h.y + d.y * 20 };
};
LV.Game.prototype.stepScroll = function (dt) {
  const s = this.scroll, h = this.hero; s.t += dt / 0.6;
  const k = Math.min(1, s.t);
  h.x = LV.lerp(s.hx, s.tx, k); h.y = LV.lerp(s.hy, s.ty, k); h.anim += dt * 8; h.moving = true;
  const to = this.camFor(this.area);
  this.cam = { x: LV.lerp(s.from.x, to.x, k), y: LV.lerp(s.from.y, to.y, k) };
  if (k >= 1) { this.scroll = null; h.safe = { x: h.x, y: h.y }; this.actors.forEach(function (a) { if (a.state === 'chase') a.state = 'sleep'; }); }
};
LV.Game.prototype.checkWarp = function () {
  const h = this.hero, w = this.world.warpAt(Math.floor(h.x / 16), Math.floor((h.y - 3) / 16));
  if (!w || h.state !== 'walk') return;
  const self = this; this.sfx('door');
  this.fadeTo = function () { self.enter(w.to, w.tx * 16 + 8, w.ty * 16 + 12, w.dir); self.fade = 1; };
};

/* ---------- drawing ---------- */
LV.Game.prototype.render = function () {
  const sh = this.shake > 0 ? Math.round((Math.random() - 0.5) * 4) : 0;
  const ctx = this.ctx, ox = Math.round(this.cam.x) + sh, oy = Math.round(this.cam.y);
  ctx.fillStyle = this.world.indoor ? '#120c10' : '#000'; ctx.fillRect(0, 0, LV.VIEW_W, LV.VIEW_H);
  LV.drawLayer(ctx, this.world, 'ground', ox, oy);
  LV.drawLayer(ctx, this.world, 'deco', ox, oy);
  LV.drawSpecialTiles(ctx, this, ox, oy);
  // actors sorted by their feet so nearer things overlap farther ones
  const all = [this.hero].concat(this.actors, this.pickups, this.shots);
  all.sort(function (a, b) { return a.y - b.y; });
  for (const a of all) a.draw(ctx, ox, oy);
  for (const e of this.effects) e.draw(ctx, ox, oy);
  if (this.hero.carry) ctx.drawImage(LV.IMG.overworld, 0, 16 * 16, 16, 16, Math.round(this.hero.x - ox - 8), Math.round(this.hero.y - oy - 36), 16, 16);
  LV.drawLayer(ctx, this.world, 'over', ox, oy);
  if (this.world.dark) this.drawDark(ctx, ox, oy);
  LV.drawHud(ctx, this);
  if (this.dialog) LV.drawDialog(ctx, this.dialog);
  if (this.paused) LV.drawMenu(ctx, this);
  if (this.fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, this.fade) + ')'; ctx.fillRect(0, 0, LV.VIEW_W, LV.VIEW_H); }
};
// Dark rooms: everything is dim except a glow round the hero (bigger with the Lantern), as in the original
LV.Game.prototype.drawDark = function (ctx, ox, oy) {
  const h = this.hero, lights = [[h.x - ox, h.y - oy - 10, this.save.items.lantern ? 64 : 30]], w = this.world;
  for (let i = 0; i < w.col.length; i++) if (w.col[i] === LV.C.TORCH_LIT) lights.push([(i % w.w) * 16 + 8 - ox, Math.floor(i / w.w) * 16 + 4 - oy, 56]);
  if (!this.darkCv) { this.darkCv = document.createElement('canvas'); this.darkCv.width = LV.VIEW_W; this.darkCv.height = LV.VIEW_H; }
  const d = this.darkCv.getContext('2d'); d.globalCompositeOperation = 'source-over'; d.clearRect(0, 0, LV.VIEW_W, LV.VIEW_H);
  d.fillStyle = 'rgba(8,4,16,.88)'; d.fillRect(0, 0, LV.VIEW_W, LV.VIEW_H); d.globalCompositeOperation = 'destination-out';
  for (const L of lights) { const gr = d.createRadialGradient(L[0], L[1], L[2] * 0.3, L[0], L[1], L[2]); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); d.fillStyle = gr; d.fillRect(L[0] - L[2], L[1] - L[2], L[2] * 2, L[2] * 2); }
  ctx.drawImage(this.darkCv, 0, 0);
};

/* ---------- sound: tiny generated effects (no audio files) ---------- */
LV.SFX = { swing: [[620, 0.05, 'square', 0.03, 300]], spin: [[300, 0.25, 'sawtooth', 0.04, 900]], hit: [[180, 0.08, 'square', 0.05, 90]], kill: [[400, 0.12, 'square', 0.04, 60]],
  hurt: [[220, 0.15, 'sawtooth', 0.06, 110]], cut: [[900, 0.05, 'triangle', 0.04, 400]], cash: [[1320, 0.05, 'square', 0.03], [1760, 0.08, 'square', 0.03]], heart: [[880, 0.06, 'triangle', 0.05], [1320, 0.1, 'triangle', 0.05]],
  chest: [[523, 0.1, 'square', 0.04], [659, 0.1, 'square', 0.04], [784, 0.1, 'square', 0.04], [1047, 0.25, 'square', 0.04]], clink: [[2000, 0.04, 'square', 0.03]], fall: [[600, 0.5, 'triangle', 0.05, 80]], splash: [[300, 0.3, 'sawtooth', 0.03, 80]],
  door: [[200, 0.08, 'square', 0.03]], lift: [[300, 0.06, 'triangle', 0.04, 500]], throw: [[500, 0.08, 'triangle', 0.04, 200]], down: [[400, 0.6, 'triangle', 0.05, 100]] };
LV.Game.prototype.sfx = function (name) {
  this.lastSfx = name;

    }

/* ================= HUD, dialog box and text ================= */

};

LV.drawHud = function (ctx, g) {

  // energy meter
  ctx.fillStyle = '#10101a'; ctx.fillRect(7, 7, 9, 34); ctx.fillStyle = '#f0f0f0'; ctx.fillRect(8, 8, 7, 32); ctx.fillStyle = '#10101a'; ctx.fillRect(9, 9, 5, 30);
  ctx.fillStyle = '#3cbe50'; ctx.fillRect(9, 9 + 30 - Math.round(30 * (s.energy === undefined ? 1 : s.energy)), 5, Math.round(30 * (s.energy === undefined ? 1 : s.energy)));
  // item box
  ctx.fillStyle = '#10101a'; ctx.fillRect(19, 7, 22, 22); ctx.fillStyle = '#f0f0f0'; ctx.fillRect(20, 8, 20, 20); ctx.fillStyle = '#181828'; ctx.fillRect(21, 9, 18, 18);

  ctx.fillStyle = '#28408c'; ctx.fillRect(79, 9, 7, 7); ctx.fillStyle = '#a08060'; ctx.fillRect(82, 7, 1, 2); LV.text(ctx, ('0' + s.bombs).slice(-2), 77, 18);
  ctx.fillStyle = '#c8a064'; ctx.fillRect(98, 12, 10, 1); ctx.fillStyle = '#e0e0e0'; ctx.fillRect(108, 11, 2, 3); LV.text(ctx, ('0' + s.arrows).slice(-2), 98, 18);

};
LV.HEART = ['.oo.oo.', 'orrorro', 'orrrrro', '.orrro.', '..oro..', '...o...'];
LV.heart = function (ctx, x, y, q) {
  for (let j = 0; j < 6; j++) for (let k = 0; k < 7; k++) {
    const c = LV.HEART[j][k]; if (c === '.') continue;
    if (c === 'o') ctx.fillStyle = '#1e0a10';

// Torches (braziers) and cracked walls are drawn from their collision codes
LV.drawSpecialTiles = function (ctx, g, ox, oy) {
  const w = g.world, x0 = Math.max(0, Math.floor(ox / 16)), y0 = Math.max(0, Math.floor(oy / 16)), x1 = Math.min(w.w - 1, x0 + 17), y1 = Math.min(w.h - 1, y0 + 15);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {

/* ---------- bombs: 1.6 s fuse, blast hurts everyone close (the hero too) and opens cracked walls ---------- */
LV.Bomb = function (x, y) { this.kind = 'bomb'; this.x = x; this.y = y; this.t = 0; this.dead = false; this.boom = false; };
LV.Bomb.prototype.update = function (g, dt) {

    for (const a of g.actors) if (!a.dead && LV.overlap(blast, a.hurtBox())) LV.applyHit(g, hit, a);
    if (LV.overlap(blast, g.hero.hurtBox())) LV.applyHit(g, new LV.Hit({ team: 'bomb', kind: 'bomb', power: 4, from: { x: this.x, y: this.y - 8 } }), g.hero);
    const T = 16;
    for (let ty = Math.floor(blast.y / T); ty <= Math.floor((blast.y + blast.h) / T); ty++) for (let tx = Math.floor(blast.x / T); tx <= Math.floor((blast.x + blast.w) / T); tx++) {
      const c = g.world.c(tx, ty);
      if (c === LV.C.CRACK) { g.world.setC(tx, ty, LV.C.OPEN); g.world.layers.deco[ty * g.world.w + tx] = -1; g.save.flags['crack:' + g.world.id + ':' + tx + ',' + ty] = 1; g.sfx('chest'); }

/* ================= More enemies: the Gilded Hand =================

LV.makeSoldier = function (rank, archer) {
